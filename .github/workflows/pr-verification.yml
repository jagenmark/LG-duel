name: Apply PR 267 review fixes

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr267-review-fix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/test-ci-audit-slice-2
          fetch-depth: 0

      - name: Apply final workflow and documentation fixes
        shell: bash
        run: |
          git show HEAD^^:.github/workflows/pr-verification.yml > .github/workflows/pr-verification.yml
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/pr267-review-fixes.yml').read_text(encoding='utf-8')
          lines = source.splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python - <<'PY'")
          end = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'PY')

          script_lines = []
          in_triple = False
          prefix = ' ' * 10
          for line in lines[start + 1:end]:
              if in_triple:
                  if "'''" in line:
                      script_lines.append(line[len(prefix):] if line.startswith(prefix) else line)
                      in_triple = False
                  else:
                      script_lines.append(line)
                  continue
              stripped = line[len(prefix):] if line.startswith(prefix) else line
              script_lines.append(stripped)
              if stripped.count("'''") % 2 == 1:
                  in_triple = True

          script = '\n'.join(script_lines) + '\n'
          exec(compile(script, 'pr267-review-apply.py', 'exec'), {'__name__': '__main__'})
          PY

      - name: Validate generated workflow
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check "PyYAML==6.0.2"
          python - <<'PY'
          import yaml
          from pathlib import Path
          with Path('.github/workflows/pr-verification.yml').open(encoding='utf-8') as handle:
              loaded = yaml.safe_load(handle)
          jobs = loaded.get('jobs', {}) if isinstance(loaded, dict) else {}
          required = {
              'linux-build-and-tests',
              'windows-build-and-tests',
              'deterministic-scenarios',
              'protocol-and-packet-budgets',
              'linux-sanitizers',
          }
          missing = required.difference(jobs)
          if missing:
              raise SystemExit('missing jobs: ' + ', '.join(sorted(missing)))
          PY
          git diff --check

      - name: Commit fixes to PR branch
        shell: bash
        run: |
          rm -f .github/workflows/pr267-review-fixes.yml
          git add .github/workflows/pr-verification.yml docs/CI-VERIFICATION.md .github/workflows/pr267-review-fixes.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix consolidated CI result isolation and evidence"
          git push origin HEAD:agent/test-ci-audit-slice-2
