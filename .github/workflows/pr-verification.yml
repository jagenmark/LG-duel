name: Apply and verify PR 265 follow-up fixes

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr265-final-followup-fix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CTEST_OUTPUT_ON_FAILURE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: integration/replay-killcam-20260816
          fetch-depth: 0

      - name: Verify expected parent
        shell: bash
        run: test "$(git rev-parse HEAD^)" = "ed2bc8610d2846be53c258b402a31c1c1aae03b7"

      - name: Apply source and regression-test patch
        run: python .github/pr265/apply_followup.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned image-validation dependency
        run: python -m pip install --disable-pip-version-check "Pillow==11.3.0"

      - name: Install pinned Vulkan SDK for shader checks
        uses: jakoch/install-vulkan-sdk-action@37effcfa045411f8bfbbda26df2fd1b3bf3436fa # v1.6.0
        with:
          vulkan_version: 1.4.357.0
          cache: true
          stripdown: true

      - name: Install build and SDL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build \
            libx11-dev libxcursor-dev libxext-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxrandr-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev \
            libgl1-mesa-dev libgles2-mesa-dev libdrm-dev libgbm-dev

      - name: Configure and build affected targets
        run: |
          cmake --preset default -DLG_DUEL_REQUIRE_PILLOW=ON -DPython3_EXECUTABLE="$(command -v python)"
          cmake --build --preset default --parallel 2 --target \
            lg_duel_client \
            lg_duel_replay_codec_tests \
            lg_duel_replay_rolling_tests \
            lg_duel_replay_storage_io_tests \
            lg_duel_replay_presentation_tests \
            lg_duel_killcam_client_receiver_tests \
            lg_duel_killcam_server_coordinator_tests

      - name: Run affected tests
        run: >
          ctest --test-dir build/default --output-on-failure
          -R "lg_duel_(replay_codec|replay_rolling|replay_storage_io|replay_presentation|killcam_client_receiver|killcam_server_coordinator)_tests"

      - name: Verify diff
        run: git diff --check

      - name: Restore permanent CI and commit verified fixes
        shell: bash
        run: |
          git show 5cdd9f476ae01afeda27a160f0b0e227d7296b76:.github/workflows/pr-verification.yml \
            > .github/workflows/pr-verification.yml
          rm -f .github/pr265/apply_followup.py
          rm -f .github/pr265/followup_payload.yml
          git add \
            src/app/GameApp.cpp \
            src/replay/RemoteKillcamPending.hpp \
            src/replay/ReplayCodec.cpp \
            src/replay/ReplayCodec.hpp \
            src/replay/ReplayIoService.cpp \
            src/replay/ReplayIoService.hpp \
            src/replay/ReplayPresentationSession.cpp \
            src/replay/ReplayRollingBuffer.cpp \
            src/replay/ReplayTransfer.hpp \
            src/replay/KillcamServerCoordinator.cpp \
            src/replay/KillcamServerCoordinator.hpp \
            tests/replay/KillcamClientReceiverTests.cpp \
            tests/replay/ReplayCodecTests.cpp \
            tests/replay/ReplayPresentationSessionTests.cpp \
            tests/replay/ReplayRollingBufferTests.cpp \
            tests/replay/ReplayStorageIoTests.cpp \
            docs/architecture/networking.md \
            .github/workflows/pr-verification.yml \
            .github/pr265/apply_followup.py \
            .github/pr265/followup_payload.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix remaining replay and killcam review findings"
          git push origin HEAD:integration/replay-killcam-20260816
