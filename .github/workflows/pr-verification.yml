name: PR verification

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CTEST_OUTPUT_ON_FAILURE: "1"
  LG_CANDIDATE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
  PYTHONUNBUFFERED: "1"

jobs:
  linux-build-and-tests:
    name: linux-build-and-tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      determinism: ${{ steps.determinism.outcome }}
      protocol: ${{ steps.protocol.outcome }}
    steps:
      - name: Check out source
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned image-validation dependency
        id: pillow
        continue-on-error: true
        run: python -m pip install --disable-pip-version-check "Pillow==11.3.0"

      - name: Install pinned Vulkan SDK for shader checks
        id: vulkan
        continue-on-error: true
        uses: jakoch/install-vulkan-sdk-action@37effcfa045411f8bfbbda26df2fd1b3bf3436fa # v1.6.0
        with:
          vulkan_version: 1.4.357.0
          cache: true
          stripdown: true

      - name: Install build and SDL window-system dependencies
        id: dependencies
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build \
            libx11-dev libxcursor-dev libxext-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxrandr-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev \
            libgl1-mesa-dev libgles2-mesa-dev libdrm-dev libgbm-dev

      - name: Configure
        id: configure
        if: always()
        continue-on-error: true
        run: cmake --preset default -DLG_DUEL_REQUIRE_PILLOW=ON -DPython3_EXECUTABLE="$(command -v python)"

      - name: Build
        id: build
        if: always()
        continue-on-error: true
        run: cmake --build --preset default --parallel 2

      - name: Run CTest
        id: ctest
        if: always()
        continue-on-error: true
        run: |
          mkdir -p verification/linux
          ctest --preset default --parallel 2 \
            --output-junit verification/linux/ctest.xml

      - name: Run smoke scenarios three times
        id: determinism
        if: always()
        continue-on-error: true
        run: |
          mkdir -p verification/deterministic-scenarios
          ./build/default/lg_duel_scenarios \
            --suite smoke \
            --repeat 3 \
            --output verification/deterministic-scenarios

      - name: Record deterministic-scenario evidence
        if: always()
        shell: bash
        run: |
          status="${{ steps.determinism.outcome }}"
          python scripts/lg_verification.py collect-ci \
            --evidence-root verification \
            --platform linux \
            --category determinism \
            --status "$status"

      - name: Enforce protocol and packet budgets
        id: protocol
        if: always()
        continue-on-error: true
        run: python scripts/lg_verification.py protocol-budget --evidence-root verification

      - name: Collect Linux build evidence
        id: linux-result
        if: always()
        shell: bash
        run: |
          status=success
          for outcome in \
            "${{ steps.checkout.outcome }}" \
            "${{ steps.python.outcome }}" \
            "${{ steps.pillow.outcome }}" \
            "${{ steps.vulkan.outcome }}" \
            "${{ steps.dependencies.outcome }}" \
            "${{ steps.configure.outcome }}" \
            "${{ steps.build.outcome }}" \
            "${{ steps.ctest.outcome }}"; do
            if [[ "$outcome" != success ]]; then
              status=failure
            fi
          done
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"
          python scripts/lg_verification.py collect-ci \
            --evidence-root verification \
            --platform linux \
            --category build \
            --status "$status"

      - name: Upload Linux evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-and-tests-${{ github.run_attempt }}
          path: |
            verification/**
            build/default/Testing/Temporary/**
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce Linux build and CTest result
        if: always()
        shell: bash
        run: test "${{ steps.linux-result.outputs.status }}" = success

  deterministic-scenarios:
    name: deterministic-scenarios
    needs: linux-build-and-tests
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record reused deterministic result
        if: always()
        shell: bash
        env:
          SOURCE_OUTCOME: ${{ needs.linux-build-and-tests.outputs.determinism }}
        run: |
          mkdir -p verification/deterministic-scenarios
          printf '{\n  "schema_version": 1,\n  "source_job": "linux-build-and-tests",\n  "source_outcome": "%s"\n}\n' \
            "$SOURCE_OUTCOME" > verification/deterministic-scenarios/gate-result.json

      - name: Upload deterministic gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-scenarios-${{ github.run_attempt }}
          path: verification/deterministic-scenarios/gate-result.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce reused deterministic result
        if: always()
        shell: bash
        run: test "${{ needs.linux-build-and-tests.outputs.determinism }}" = success

  protocol-and-packet-budgets:
    name: protocol-and-packet-budgets
    needs: linux-build-and-tests
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record reused protocol result
        if: always()
        shell: bash
        env:
          SOURCE_OUTCOME: ${{ needs.linux-build-and-tests.outputs.protocol }}
        run: |
          mkdir -p verification/protocol
          printf '{\n  "schema_version": 1,\n  "source_job": "linux-build-and-tests",\n  "source_outcome": "%s"\n}\n' \
            "$SOURCE_OUTCOME" > verification/protocol/gate-result.json

      - name: Upload protocol gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-and-packet-budgets-${{ github.run_attempt }}
          path: verification/protocol/gate-result.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce reused protocol-budget result
        if: always()
        shell: bash
        run: test "${{ needs.linux-build-and-tests.outputs.protocol }}" = success

  linux-sanitizers:
    name: linux-sanitizers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install build tools
        id: dependencies
        if: always()
        continue-on-error: true
        run: sudo apt-get update && sudo apt-get install --yes ninja-build

      - name: Configure focused sanitizers
        id: configure
        if: always()
        continue-on-error: true
        run: |
          cmake -S . -B build/sanitize -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DLG_DUEL_REQUIRE_SDL3=OFF \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build focused sanitizer targets
        id: build
        if: always()
        continue-on-error: true
        run: >
          cmake --build build/sanitize --parallel 2
          --target lg_duel_scenario_tests lg_duel_protocol_tests

      - name: Run focused address and undefined behavior checks
        id: test
        if: always()
        continue-on-error: true
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: >
          ctest --test-dir build/sanitize --output-on-failure
          -R "lg_duel_(scenario|protocol)_tests"

      - name: Collect structured sanitizer evidence
        if: always()
        shell: bash
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          CONFIGURE_OUTCOME: ${{ steps.configure.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
        run: |
          mkdir -p verification/sanitizers
          python3 - <<'PY_EVIDENCE'
          import json
          import os
          from pathlib import Path

          outcomes = {
              "checkout": os.environ.get("CHECKOUT_OUTCOME", "skipped"),
              "dependencies": os.environ.get("DEPENDENCIES_OUTCOME", "skipped"),
              "configure": os.environ.get("CONFIGURE_OUTCOME", "skipped"),
              "build": os.environ.get("BUILD_OUTCOME", "skipped"),
              "test": os.environ.get("TEST_OUTCOME", "skipped"),
          }
          status = "PASS" if all(value == "success" for value in outcomes.values()) else "FAIL"
          Path("verification/sanitizers/result.json").write_text(
              json.dumps({"schema_version": 1, "status": status, "steps": outcomes}, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY_EVIDENCE
          status=failure
          if [[ "$CHECKOUT_OUTCOME" == success && \
                "$DEPENDENCIES_OUTCOME" == success && \
                "$CONFIGURE_OUTCOME" == success && \
                "$BUILD_OUTCOME" == success && \
                "$TEST_OUTCOME" == success ]]; then
            status=success
          fi
          if [[ -f scripts/lg_verification.py ]]; then
            python3 scripts/lg_verification.py collect-ci \
              --evidence-root verification \
              --platform linux \
              --category unit \
              --status "$status"
          fi

      - name: Upload sanitizer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-sanitizers-${{ github.run_attempt }}
          path: |
            verification/**
            build/sanitize/Testing/Temporary/**
          if-no-files-found: error
          retention-days: 14

      - name: Enforce sanitizer result
        if: always()
        shell: bash
        run: |
          for outcome in \
            "${{ steps.checkout.outcome }}" \
            "${{ steps.dependencies.outcome }}" \
            "${{ steps.configure.outcome }}" \
            "${{ steps.build.outcome }}" \
            "${{ steps.test.outcome }}"; do
            if [[ "$outcome" != success ]]; then
              exit 1
            fi
          done

  windows-build-and-tests:
    name: windows-build-and-tests
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      LG_BUILD_VERSION: Release
    outputs:
      live: ${{ steps.live.outcome }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned image-validation dependency
        run: python -m pip install --disable-pip-version-check "Pillow==11.3.0"

      - name: Install pinned Vulkan SDK for shader checks
        uses: jakoch/install-vulkan-sdk-action@37effcfa045411f8bfbbda26df2fd1b3bf3436fa # v1.6.0
        with:
          vulkan_version: 1.4.357.0
          cache: true
          stripdown: true

      - name: Configure
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          cmake --preset msvc -DLG_DUEL_REQUIRE_PILLOW=ON "-DPython3_EXECUTABLE=$python"

      - name: Build
        id: build
        run: cmake --build --preset msvc --config Release --parallel 2

      - name: Run CTest
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force verification/windows | Out-Null
          ctest --preset msvc -C Release --parallel 2 `
            --output-junit verification/windows/ctest.xml

      - name: Collect CI evidence
        if: always()
        run: >
          python scripts/lg_verification.py collect-ci
          --evidence-root verification
          --platform windows
          --category build
          --status "${{ job.status }}"

      - name: Run fallback live smoke
        id: live
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        shell: pwsh
        run: |
          $failed = $false
          $scenarios = @(
            "basic_forward.json",
            "jump_and_attack_edge.json",
            "movement_latency_40ms.json"
          )
          foreach ($scenario in $scenarios) {
            python scripts/lg_live_scenario.py `
              "scenarios/live/$scenario" `
              --renderer fallback `
              --allow-fallback `
              --timeout 90 `
              --build-dir build/msvc/Release `
              --output-root verification/live-client-server
            if ($LASTEXITCODE -ne 0) {
              $failed = $true
            }
          }
          if ($failed) {
            throw "One or more live smoke scenarios failed."
          }

      - name: Collect live smoke evidence
        if: always()
        run: >
          python scripts/lg_verification.py collect-ci
          --evidence-root verification
          --platform windows
          --category live
          --status "${{ steps.live.outcome }}"

      - name: Upload Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-and-tests-${{ github.run_attempt }}
          path: |
            verification/**
            build/msvc/Testing/Temporary/**
          if-no-files-found: warn
          retention-days: 14

  live-client-server-smoke:
    name: live-client-server-smoke
    needs: windows-build-and-tests
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record reused live smoke result
        env:
          SOURCE_OUTCOME: ${{ needs.windows-build-and-tests.outputs.live }}
        run: |
          mkdir -p verification/live-client-server
          printf '{"source_job":"windows-build-and-tests","source_outcome":"%s"}\n' \
            "$SOURCE_OUTCOME" > verification/live-client-server/gate-result.json

      - name: Upload live smoke gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-client-server-smoke-${{ github.run_attempt }}
          path: verification/live-client-server/gate-result.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce reused live smoke result
        if: always()
        run: test "${{ needs.windows-build-and-tests.outputs.live }}" = success
