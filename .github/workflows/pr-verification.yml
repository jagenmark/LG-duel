name: Apply PR 265 follow-up review fixes

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr265-followup-review-fix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: integration/replay-killcam-20260816
          fetch-depth: 0

      - name: Apply replay and killcam patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/pr265-followup-review-fixes.yml').read_text(encoding='utf-8')
          lines = source.splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python - <<'PY'")
          end = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'PY')
          script = textwrap.dedent('\n'.join(lines[start + 1:end])) + '\n'

          bad = "      }\n  };\n\n'''\n          game = game[:completed_start] + completed_block + game[completed_end:]"
          good = "      }\n'''\n          game = game[:completed_start] + completed_block + game[completed_end:]"
          if script.count(bad) != 1:
              raise SystemExit('could not repair completed-transfer replacement block')
          script = script.replace(bad, good, 1)
          exec(compile(script, 'pr265-followup-apply.py', 'exec'), {'__name__': '__main__'})
          PY

      - name: Restore permanent PR workflow
        shell: bash
        run: git show HEAD^:.github/workflows/pr-verification.yml > .github/workflows/pr-verification.yml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned image-validation dependency
        run: python -m pip install --disable-pip-version-check "Pillow==11.3.0"

      - name: Install pinned Vulkan SDK for shader checks
        uses: jakoch/install-vulkan-sdk-action@37effcfa045411f8bfbbda26df2fd1b3bf3436fa # v1.6.0
        with:
          vulkan_version: 1.4.357.0
          cache: true
          stripdown: true

      - name: Install build and SDL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build \
            libx11-dev libxcursor-dev libxext-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxrandr-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev \
            libgl1-mesa-dev libgles2-mesa-dev libdrm-dev libgbm-dev

      - name: Configure and build affected targets
        run: |
          cmake --preset default -DLG_DUEL_REQUIRE_PILLOW=ON -DPython3_EXECUTABLE="$(command -v python)"
          cmake --build --preset default --parallel 2 --target \
            lg_duel_client \
            lg_duel_replay_codec_tests \
            lg_duel_replay_rolling_tests \
            lg_duel_replay_storage_io_tests \
            lg_duel_replay_presentation_tests \
            lg_duel_killcam_client_receiver_tests \
            lg_duel_killcam_server_coordinator_tests

      - name: Run affected tests
        run: >
          ctest --test-dir build/default --output-on-failure
          -R "lg_duel_(replay_codec|replay_rolling|replay_storage_io|replay_presentation|killcam_client_receiver|killcam_server_coordinator)_tests"

      - name: Verify and commit fixes
        shell: bash
        run: |
          rm -f .github/workflows/pr265-followup-review-fixes.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix remaining replay and killcam review findings"
          git push origin HEAD:integration/replay-killcam-20260816
