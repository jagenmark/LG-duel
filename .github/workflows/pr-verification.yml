name: PR verification

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CTEST_OUTPUT_ON_FAILURE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  linux-build-and-tests:
    name: linux-build-and-tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build and SDL window-system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build \
            libx11-dev libxcursor-dev libxext-dev libxfixes-dev libxi-dev \
            libxrandr-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev \
            libgl1-mesa-dev libgles2-mesa-dev libdrm-dev libgbm-dev

      - name: Configure
        run: cmake --preset default

      - name: Build
        run: cmake --build --preset default --parallel 2

      - name: Run CTest
        run: |
          mkdir -p verification/linux
          ctest --preset default --output-junit verification/linux/ctest.xml

      - name: Run Python tests
        if: always()
        shell: bash
        run: |
          status=0
          for test_file in scripts/test_*.py; do
            python "$test_file" || status=1
          done
          exit "$status"

      - name: Run focused address and undefined behavior checks
        if: always()
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cmake -S . -B build/sanitize -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DLG_DUEL_REQUIRE_SDL3=OFF \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build/sanitize --parallel 2 --target lg_duel_scenario_tests lg_duel_protocol_tests
          ctest --test-dir build/sanitize --output-on-failure \
            -R "lg_duel_(scenario|protocol)_tests"

      - name: Collect CI evidence
        if: always()
        run: >
          python scripts/lg_verification.py collect-ci
          --evidence-root verification
          --platform linux
          --category build
          --status "${{ job.status }}"

      - name: Upload Linux evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-and-tests-${{ github.run_attempt }}
          path: |
            verification/**
            build/default/Testing/Temporary/**
            build/sanitize/Testing/Temporary/**
          if-no-files-found: warn
          retention-days: 3

  windows-build-and-tests:
    name: windows-build-and-tests
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure
        run: cmake --preset msvc

      - name: Build
        run: cmake --build --preset msvc --parallel 2

      - name: Run CTest
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force verification/windows | Out-Null
          ctest --preset msvc --output-junit verification/windows/ctest.xml

      - name: Run Python tests
        if: always()
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts/test_*.py | Sort-Object Name | ForEach-Object {
            python $_.FullName
            if ($LASTEXITCODE -ne 0) {
              $failed = $true
            }
          }
          if ($failed) {
            throw "One or more Python test files failed."
          }

      - name: Collect CI evidence
        if: always()
        run: >
          python scripts/lg_verification.py collect-ci
          --evidence-root verification
          --platform windows
          --category build
          --status "${{ job.status }}"

      - name: Upload Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-and-tests-${{ github.run_attempt }}
          path: |
            verification/**
            build/msvc/Testing/Temporary/**
          if-no-files-found: warn
          retention-days: 3

  deterministic-scenarios:
    name: deterministic-scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build and SDL window-system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build \
            libx11-dev libxcursor-dev libxext-dev libxfixes-dev libxi-dev \
            libxrandr-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev \
            libgl1-mesa-dev libgles2-mesa-dev libdrm-dev libgbm-dev

      - name: Build scenario runner
        run: |
          cmake --preset default
          cmake --build --preset default --parallel 2 --target lg_duel_scenarios

      - name: Run smoke scenarios three times
        run: |
          mkdir -p verification/deterministic-scenarios
          ./build/default/lg_duel_scenarios \
            --suite smoke \
            --repeat 3 \
            --output verification/deterministic-scenarios

      - name: Collect CI evidence
        if: always()
        run: >
          python scripts/lg_verification.py collect-ci
          --evidence-root verification
          --platform linux
          --category determinism
          --status "${{ job.status }}"

      - name: Upload deterministic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-scenarios-${{ github.run_attempt }}
          path: verification/**
          if-no-files-found: warn
          retention-days: 3

  live-client-server-smoke:
    name: live-client-server-smoke
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build live scenario targets
        run: |
          cmake -S . -B build/live -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTING=ON `
            -DLG_DUEL_REQUIRE_SDL3=ON `
            -DLG_DUEL_FETCH_SDL3=ON `
            -DCMAKE_DISABLE_FIND_PACKAGE_SDL3=TRUE
          cmake --build build/live --config Release --parallel 2 --target lg_duel_client lg_duel_server lg_duel_scenarios

      - name: Run fallback live smoke
        shell: pwsh
        run: |
          $failed = $false
          $scenarios = @(
            "basic_forward.json",
            "jump_and_attack_edge.json",
            "movement_latency_40ms.json"
          )
          foreach ($scenario in $scenarios) {
            python scripts/lg_live_scenario.py `
              "scenarios/live/$scenario" `
              --renderer fallback `
              --allow-fallback `
              --timeout 90 `
              --build-dir build/live/Release `
              --output-root verification/live-client-server
            if ($LASTEXITCODE -ne 0) {
              $failed = $true
            }
          }
          if ($failed) {
            throw "One or more live smoke scenarios failed."
          }

      - name: Collect CI evidence
        if: always()
        run: >
          python scripts/lg_verification.py collect-ci
          --evidence-root verification
          --platform windows
          --category live
          --status "${{ job.status }}"

      - name: Upload live smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-client-server-smoke-${{ github.run_attempt }}
          path: verification/**
          if-no-files-found: warn
          retention-days: 3

  protocol-and-packet-budgets:
    name: protocol-and-packet-budgets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build and SDL window-system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build \
            libx11-dev libxcursor-dev libxext-dev libxfixes-dev libxi-dev \
            libxrandr-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev \
            libgl1-mesa-dev libgles2-mesa-dev libdrm-dev libgbm-dev

      - name: Build protocol checks
        run: |
          cmake --preset default
          cmake --build --preset default --parallel 2 --target lg_duel_protocol_tests

      - name: Enforce protocol and packet budgets
        run: python scripts/lg_verification.py protocol-budget --evidence-root verification

      - name: Collect CI evidence
        if: always()
        run: >
          python scripts/lg_verification.py collect-ci
          --evidence-root verification
          --platform linux
          --category protocol
          --status "${{ job.status }}"

      - name: Upload protocol evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-and-packet-budgets-${{ github.run_attempt }}
          path: verification/**
          if-no-files-found: warn
          retention-days: 3

  performance-smoke:
    name: performance-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install --yes ninja-build

      - name: Run bounded hosted-runner performance check
        env:
          BASELINE: ${{ github.event.pull_request.base.sha || 'HEAD^' }}
          CANDIDATE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >
          python scripts/lg_compare_benchmarks.py
          --baseline "$BASELINE"
          --candidate "$CANDIDATE"
          --suite pr_headless
          --repetitions 5
          --profile pr_headless
          --output verification/benchmarks

      - name: Collect CI evidence
        if: always()
        shell: bash
        run: |
          status="${{ job.status }}"
          comparison="verification/benchmarks/comparison.json"
          if [[ -f "$comparison" ]]; then
            status="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["status"].lower())' "$comparison")"
          fi
          python scripts/lg_verification.py collect-ci \
            --evidence-root verification \
            --platform linux \
            --category performance \
            --status "$status"

      - name: Add performance report to the run summary
        if: always()
        shell: bash
        run: |
          report="verification/benchmarks/report.md"
          if [[ -f "$report" ]]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Performance smoke" >> "$GITHUB_STEP_SUMMARY"
            echo "The report was not produced. See the uploaded evidence." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-smoke-${{ github.run_attempt }}
          path: |
            verification/**
            !verification/benchmarks/temp/**
          if-no-files-found: warn
          retention-days: 3
