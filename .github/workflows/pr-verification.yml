name: Apply PR 267 review fixes

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr267-review-fix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/test-ci-audit-slice-2
          fetch-depth: 0

      - name: Generate final workflow and documentation
        shell: bash
        run: |
          git show 1e48c92edcac717e842b8695de27eb850766d819:.github/workflows/pr-verification.yml \
            > .github/workflows/pr-verification.yml
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/pr267-review-fixes.yml').read_text(encoding='utf-8')
          lines = source.splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python - <<'PY'")
          end = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'PY')

          script_lines = []
          in_triple = False
          prefix = ' ' * 10
          for line in lines[start + 1:end]:
              if in_triple:
                  if "'''" in line:
                      script_lines.append(line[len(prefix):] if line.startswith(prefix) else line)
                      in_triple = False
                  else:
                      script_lines.append(line)
                  continue
              stripped = line[len(prefix):] if line.startswith(prefix) else line
              script_lines.append(stripped)
              if stripped.count("'''") % 2 == 1:
                  in_triple = True

          script = '\n'.join(script_lines) + '\n'
          exec(compile(script, 'pr267-review-apply.py', 'exec'), {'__name__': '__main__'})
          PY

      - name: Validate final workflow
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check "PyYAML==6.0.2"
          python - <<'PY'
          import yaml
          from pathlib import Path
          path = Path('.github/workflows/pr-verification.yml')
          with path.open(encoding='utf-8') as handle:
              loaded = yaml.safe_load(handle)
          jobs = loaded.get('jobs', {}) if isinstance(loaded, dict) else {}
          required = {
              'linux-build-and-tests',
              'windows-build-and-tests',
              'deterministic-scenarios',
              'protocol-and-packet-budgets',
              'linux-sanitizers',
          }
          missing = required.difference(jobs)
          if missing:
              raise SystemExit('missing jobs: ' + ', '.join(sorted(missing)))
          linux_steps = jobs['linux-build-and-tests'].get('steps', [])
          ids = {step.get('id') for step in linux_steps}
          if not {'ctest', 'determinism', 'protocol'}.issubset(ids):
              raise SystemExit('Linux workflow lacks isolated result steps')
          PY
          git diff --check
          mkdir -p verification/generated-workflow
          cp .github/workflows/pr-verification.yml \
            verification/generated-workflow/pr-verification.yml

      - name: Upload validated workflow
        uses: actions/upload-artifact@v4
        with:
          name: pr267-final-workflow-${{ github.run_attempt }}
          path: verification/generated-workflow/pr-verification.yml
          if-no-files-found: error
          retention-days: 3

      - name: Commit documentation update
        shell: bash
        run: |
          git add docs/CI-VERIFICATION.md
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "Document consolidated required CI checks"
            git push origin HEAD:agent/test-ci-audit-slice-2
          fi
