name: Apply verified PR 265 source fixes

on:
  push:
    branches:
      - integration/replay-killcam-20260816
    paths:
      - .github/workflows/pr265-source-fix.yml
      - .github/pr265/followup_payload.yml

permissions:
  contents: write

concurrency:
  group: pr265-source-fix
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: integration/replay-killcam-20260816
          fetch-depth: 2

      - name: Verify expected parent
        shell: bash
        run: test "$(git rev-parse HEAD^)" = "f09f10814b6892ff8db7dba83d7ff2a8b4c989a9"

      - name: Apply source and regression-test patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          payload_path = Path('.github/pr265/followup_payload.yml')
          source = payload_path.read_text(encoding='utf-8')
          lines = source.splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python - <<'PY'")
          end = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'PY')

          script_lines = []
          in_triple = False
          prefix = ' ' * 10
          for line in lines[start + 1:end]:
              if in_triple:
                  if "'''" in line:
                      script_lines.append(line[len(prefix):] if line.startswith(prefix) else line)
                      in_triple = False
                  else:
                      script_lines.append(line)
                  continue
              stripped = line[len(prefix):] if line.startswith(prefix) else line
              script_lines.append(stripped)
              if stripped.count("'''") % 2 == 1:
                  in_triple = True

          script = '\n'.join(script_lines) + '\n'
          exec(compile(script, 'pr265-followup-apply.py', 'exec'), {'__name__': '__main__'})

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}')
              file_path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Repair the transfer-loop closure produced by the retained payload.
          replace_once(
              'src/app/GameApp.cpp',
              '''      }
  };

    if (const std::optional<replay::ReplayTransferMessage> timeout =''',
              '''      }
    }
    if (const std::optional<replay::ReplayTransferMessage> timeout =''',
          )

          # A manual skip must release the new decoded-candidate state too.
          replace_once(
              'src/app/GameApp.cpp',
              '''    [&killcamReceiver, &session, &replayRuntime, &remoteKillcamActive,
     &pendingKillcamDecode, &pendingKillcamContext,
     &replayPresentationResetRequested](''',
              '''    [&killcamReceiver, &session, &replayRuntime, &remoteKillcamActive,
     &pendingKillcamDecode, &pendingKillcamDecodeIdentity,
     &pendingKillcamPlayback, &pendingKillcamContext,
     &replayPresentationResetRequested](''',
          )
          replace_once(
              'src/app/GameApp.cpp',
              '''      pendingKillcamDecode.reset();
      pendingKillcamContext.reset();
      if (remoteKillcamActive && replayRuntime != nullptr &&''',
              '''      pendingKillcamDecode.reset();
      pendingKillcamDecodeIdentity.reset();
      pendingKillcamPlayback.reset();
      pendingKillcamContext.reset();
      if (remoteKillcamActive && replayRuntime != nullptr &&''',
          )

          # Keep the same-tick capacity a named production contract and make
          # the admission regression use that exact value.
          replace_once(
              'src/replay/KillcamServerCoordinator.hpp',
              '''inline constexpr std::size_t kDefaultKillcamPacketsPerTick = 2U;
''',
              '''inline constexpr std::size_t kDefaultKillcamPacketsPerTick = 2U;
inline constexpr std::size_t kKillcamEncodeQueueCapacity = 2U;
''',
          )
          replace_once(
              'src/replay/KillcamServerCoordinator.cpp',
              '''      io_(ReplayIoService::Config{2U}),''',
              '''      io_(ReplayIoService::Config{kKillcamEncodeQueueCapacity}),''',
          )
          replace_once(
              'tests/replay/ReplayStorageIoTests.cpp',
              '''#include "replay/ReplayIoService.hpp"
''',
              '''#include "replay/ReplayIoService.hpp"
#include "replay/KillcamServerCoordinator.hpp"
''',
          )
          replace_once(
              'tests/replay/ReplayStorageIoTests.cpp',
              '''      lg::replay::ReplayIoService::Config{2U, false}
''',
              '''      lg::replay::ReplayIoService::Config{
        lg::replay::kKillcamEncodeQueueCapacity, false
      }
''',
          )

          replace_once(
              'tests/replay/KillcamClientReceiverTests.cpp',
              '''#include <string_view>
#include <vector>
''',
              '''#include <string_view>
#include <utility>
#include <vector>
''',
          )
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned image-validation dependency
        run: python -m pip install --disable-pip-version-check "Pillow==11.3.0"

      - name: Install pinned Vulkan SDK for shader checks
        uses: jakoch/install-vulkan-sdk-action@37effcfa045411f8bfbbda26df2fd1b3bf3436fa # v1.6.0
        with:
          vulkan_version: 1.4.357.0
          cache: true
          stripdown: true

      - name: Install build and SDL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build \
            libx11-dev libxcursor-dev libxext-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxrandr-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev \
            libgl1-mesa-dev libgles2-mesa-dev libdrm-dev libgbm-dev

      - name: Configure and build affected targets
        run: |
          cmake --preset default -DLG_DUEL_REQUIRE_PILLOW=ON -DPython3_EXECUTABLE="$(command -v python)"
          cmake --build --preset default --parallel 2 --target \
            lg_duel_client \
            lg_duel_replay_codec_tests \
            lg_duel_replay_rolling_tests \
            lg_duel_replay_storage_io_tests \
            lg_duel_replay_presentation_tests \
            lg_duel_killcam_client_receiver_tests \
            lg_duel_killcam_server_coordinator_tests

      - name: Run affected tests
        run: >
          ctest --test-dir build/default --output-on-failure
          -R "lg_duel_(replay_codec|replay_rolling|replay_storage_io|replay_presentation|killcam_client_receiver|killcam_server_coordinator)_tests"

      - name: Verify diff
        run: git diff --check

      - name: Commit verified source fixes
        shell: bash
        run: |
          rm .github/workflows/pr265-source-fix.yml
          rm .github/pr265/followup_payload.yml
          git add \
            src/app/GameApp.cpp \
            src/replay/RemoteKillcamPending.hpp \
            src/replay/ReplayCodec.cpp \
            src/replay/ReplayCodec.hpp \
            src/replay/ReplayIoService.cpp \
            src/replay/ReplayIoService.hpp \
            src/replay/ReplayPresentationSession.cpp \
            src/replay/ReplayRollingBuffer.cpp \
            src/replay/ReplayTransfer.hpp \
            src/replay/KillcamServerCoordinator.cpp \
            src/replay/KillcamServerCoordinator.hpp \
            tests/replay/KillcamClientReceiverTests.cpp \
            tests/replay/ReplayCodecTests.cpp \
            tests/replay/ReplayPresentationSessionTests.cpp \
            tests/replay/ReplayRollingBufferTests.cpp \
            tests/replay/ReplayStorageIoTests.cpp \
            docs/architecture/networking.md \
            .github/workflows/pr265-source-fix.yml \
            .github/pr265/followup_payload.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix remaining replay and killcam review findings"
          git push origin HEAD:integration/replay-killcam-20260816
