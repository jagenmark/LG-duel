name: Apply PR 265 blocker fixes

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

concurrency:
  group: pr265-blocker-fixes
  cancel-in-progress: true

jobs:
  implement-and-validate:
    if: github.head_ref == 'integration/replay-killcam-20260816'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CTEST_OUTPUT_ON_FAILURE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out the exact PR head
        uses: actions/checkout@v4
        with:
          ref: integration/replay-killcam-20260816
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned image-validation dependency
        run: python -m pip install --disable-pip-version-check "Pillow==11.3.0"

      - name: Install pinned Vulkan SDK for shader checks
        uses: jakoch/install-vulkan-sdk-action@37effcfa045411f8bfbbda26df2fd1b3bf3436fa # v1.6.0
        with:
          vulkan_version: 1.4.357.0
          cache: true
          stripdown: true

      - name: Install build and SDL window-system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build \
            libx11-dev libxcursor-dev libxext-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxrandr-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev \
            libgl1-mesa-dev libgles2-mesa-dev libdrm-dev libgbm-dev

      - name: Create isolated implementation worktree
        id: worktree
        shell: bash
        run: |
          set -euo pipefail
          worktree="$RUNNER_TEMP/pr265-worktree"
          manifest="$RUNNER_TEMP/pr265-files.txt"
          git worktree add --detach "$worktree" "$GITHUB_SHA"
          echo "path=$worktree" >> "$GITHUB_OUTPUT"
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"

      - name: Apply blocker fixes
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode "${{ steps.worktree.outputs.path }}/.github/pr265/apply_fixes.py.gz.b64" | \
            gzip --decompress > "$RUNNER_TEMP/apply-pr265-fixes.py"
          python "$RUNNER_TEMP/apply-pr265-fixes.py" \
            "${{ steps.worktree.outputs.path }}" \
            "${{ steps.worktree.outputs.manifest }}"
          git -C "${{ steps.worktree.outputs.path }}" diff --check
          git -C "${{ steps.worktree.outputs.path }}" status --short

      - name: Configure
        working-directory: ${{ steps.worktree.outputs.path }}
        run: cmake --preset default -DLG_DUEL_REQUIRE_PILLOW=ON -DPython3_EXECUTABLE="$(command -v python)"

      - name: Build
        working-directory: ${{ steps.worktree.outputs.path }}
        run: cmake --build --preset default --parallel 2

      - name: Run CTest
        working-directory: ${{ steps.worktree.outputs.path }}
        run: ctest --preset default --parallel 2 --output-on-failure

      - name: Commit only the reviewed implementation paths
        shell: bash
        run: |
          set -euo pipefail
          worktree="${{ steps.worktree.outputs.path }}"
          manifest="${{ steps.worktree.outputs.manifest }}"
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            git -C "$worktree" add -- "$path"
          done < "$manifest"
          git -C "$worktree" diff --cached --check
          if [ -n "$(git -C "$worktree" diff --name-only)" ]; then
            echo "Unstaged tracked changes remain:" >&2
            git -C "$worktree" diff --name-only >&2
            exit 1
          fi
          git -C "$worktree" config user.name "github-actions[bot]"
          git -C "$worktree" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$worktree" commit -m "Fix replay and killcam blockers"
          git -C "$worktree" push origin HEAD:integration/replay-killcam-20260816
