name: Windows Playtest Package

on:
  workflow_dispatch:
    inputs:
      server_host:
        description: Optional server host override (defaults to the VM_HOST repository secret)
        required: false
        type: string
      server_port:
        description: UDP server port
        required: true
        default: "27960"
        type: string
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  windows-package:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      SERVER_HOST: ${{ inputs.server_host || secrets.VM_HOST }}
      SERVER_PORT: ${{ inputs.server_port || '27960' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate package settings
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SERVER_HOST)) {
            throw "Set the VM_HOST repository secret or provide the server_host workflow input."
          }

      - name: Configure release build
        run: >
          cmake -S . -B build/windows -A x64
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DLG_DUEL_REQUIRE_SDL3=ON
          -DLG_DUEL_FETCH_SDL3=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_SDL3=TRUE
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Build package binaries
        run: cmake --build build/windows --config Release --target lg_duel_client lg_duel_server --parallel

      - name: Create package directory
        shell: pwsh
        run: >
          ./scripts/package-windows.ps1
          -BuildDir build/windows
          -OutputDir dist/LG-Duel-Windows-x64
          -Configuration Release
          -ServerHost "$env:SERVER_HOST"
          -ServerPort ([int]$env:SERVER_PORT)

      - name: Create ZIP
        shell: pwsh
        run: Compress-Archive -Path dist/LG-Duel-Windows-x64 -DestinationPath dist/LG-Duel-Windows-x64.zip

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v7
        with:
          name: LG-Duel-Windows-x64
          path: dist/LG-Duel-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
          archive: false
