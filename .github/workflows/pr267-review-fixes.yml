name: Apply PR 267 review fixes

on:
  push:
    branches:
      - agent/test-ci-audit-slice-2
    paths:
      - .github/workflows/pr267-review-fixes.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/test-ci-audit-slice-2
          fetch-depth: 2

      - name: Verify expected parent
        shell: bash
        run: test "$(git rev-parse HEAD^)" = "1e48c92edcac717e842b8695de27eb850766d819"

      - name: Apply workflow and documentation fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow_path = Path('.github/workflows/pr-verification.yml')
          text = workflow_path.read_text(encoding='utf-8')
          start = text.index('  linux-build-and-tests:\n')
          end = text.index('  windows-build-and-tests:\n')
          dollar = chr(36)
          block = r'''  linux-build-and-tests:
    name: linux-build-and-tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      determinism: __DOLLAR__{{ steps.determinism.outcome }}
      protocol: __DOLLAR__{{ steps.protocol.outcome }}
    steps:
      - name: Check out source
        id: checkout
        uses: actions/checkout@v4

      - name: Set up Python
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned image-validation dependency
        id: pillow
        continue-on-error: true
        run: python -m pip install --disable-pip-version-check "Pillow==11.3.0"

      - name: Install pinned Vulkan SDK for shader checks
        id: vulkan
        continue-on-error: true
        uses: jakoch/install-vulkan-sdk-action@37effcfa045411f8bfbbda26df2fd1b3bf3436fa # v1.6.0
        with:
          vulkan_version: 1.4.357.0
          cache: true
          stripdown: true

      - name: Install build and SDL window-system dependencies
        id: dependencies
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build \
            libx11-dev libxcursor-dev libxext-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxrandr-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev \
            libgl1-mesa-dev libgles2-mesa-dev libdrm-dev libgbm-dev

      - name: Configure
        id: configure
        if: always()
        continue-on-error: true
        run: cmake --preset default -DLG_DUEL_REQUIRE_PILLOW=ON -DPython3_EXECUTABLE="$(command -v python)"

      - name: Build
        id: build
        if: always()
        continue-on-error: true
        run: cmake --build --preset default --parallel 2

      - name: Run CTest
        id: ctest
        if: always()
        continue-on-error: true
        run: |
          mkdir -p verification/linux
          ctest --preset default --parallel 2 \
            --output-junit verification/linux/ctest.xml

      - name: Run smoke scenarios three times
        id: determinism
        if: always()
        continue-on-error: true
        run: |
          mkdir -p verification/deterministic-scenarios
          ./build/default/lg_duel_scenarios \
            --suite smoke \
            --repeat 3 \
            --output verification/deterministic-scenarios

      - name: Record deterministic-scenario evidence
        if: always()
        shell: bash
        run: |
          status="__DOLLAR__{{ steps.determinism.outcome }}"
          python scripts/lg_verification.py collect-ci \
            --evidence-root verification \
            --platform linux \
            --category determinism \
            --status "$status"

      - name: Enforce protocol and packet budgets
        id: protocol
        if: always()
        continue-on-error: true
        run: python scripts/lg_verification.py protocol-budget --evidence-root verification

      - name: Collect Linux build evidence
        if: always()
        shell: bash
        run: |
          status=success
          for outcome in \
            "__DOLLAR__{{ steps.checkout.outcome }}" \
            "__DOLLAR__{{ steps.python.outcome }}" \
            "__DOLLAR__{{ steps.pillow.outcome }}" \
            "__DOLLAR__{{ steps.vulkan.outcome }}" \
            "__DOLLAR__{{ steps.dependencies.outcome }}" \
            "__DOLLAR__{{ steps.configure.outcome }}" \
            "__DOLLAR__{{ steps.build.outcome }}" \
            "__DOLLAR__{{ steps.ctest.outcome }}"; do
            if [[ "$outcome" != success ]]; then
              status=failure
            fi
          done
          python scripts/lg_verification.py collect-ci \
            --evidence-root verification \
            --platform linux \
            --category build \
            --status "$status"

      - name: Upload Linux evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-and-tests-__DOLLAR__{{ github.run_attempt }}
          path: |
            verification/**
            build/default/Testing/Temporary/**
          if-no-files-found: warn
          retention-days: 3

      - name: Enforce Linux build and CTest result
        if: always()
        shell: bash
        run: |
          for outcome in \
            "__DOLLAR__{{ steps.checkout.outcome }}" \
            "__DOLLAR__{{ steps.python.outcome }}" \
            "__DOLLAR__{{ steps.pillow.outcome }}" \
            "__DOLLAR__{{ steps.vulkan.outcome }}" \
            "__DOLLAR__{{ steps.dependencies.outcome }}" \
            "__DOLLAR__{{ steps.configure.outcome }}" \
            "__DOLLAR__{{ steps.build.outcome }}" \
            "__DOLLAR__{{ steps.ctest.outcome }}"; do
            if [[ "$outcome" != success ]]; then
              exit 1
            fi
          done

  deterministic-scenarios:
    name: deterministic-scenarios
    needs: linux-build-and-tests
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Enforce reused deterministic result
        shell: bash
        run: test "__DOLLAR__{{ needs.linux-build-and-tests.outputs.determinism }}" = success

  protocol-and-packet-budgets:
    name: protocol-and-packet-budgets
    needs: linux-build-and-tests
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Enforce reused protocol-budget result
        shell: bash
        run: test "__DOLLAR__{{ needs.linux-build-and-tests.outputs.protocol }}" = success

  linux-sanitizers:
    name: linux-sanitizers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v4

      - name: Install build tools
        id: dependencies
        if: always()
        continue-on-error: true
        run: sudo apt-get update && sudo apt-get install --yes ninja-build

      - name: Configure focused sanitizers
        id: configure
        if: always()
        continue-on-error: true
        run: |
          cmake -S . -B build/sanitize -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DLG_DUEL_REQUIRE_SDL3=OFF \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build focused sanitizer targets
        id: build
        if: always()
        continue-on-error: true
        run: >
          cmake --build build/sanitize --parallel 2
          --target lg_duel_scenario_tests lg_duel_protocol_tests

      - name: Run focused address and undefined behavior checks
        id: test
        if: always()
        continue-on-error: true
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: >
          ctest --test-dir build/sanitize --output-on-failure
          -R "lg_duel_(scenario|protocol)_tests"

      - name: Collect structured sanitizer evidence
        if: always()
        shell: bash
        env:
          CHECKOUT_OUTCOME: __DOLLAR__{{ steps.checkout.outcome }}
          DEPENDENCIES_OUTCOME: __DOLLAR__{{ steps.dependencies.outcome }}
          CONFIGURE_OUTCOME: __DOLLAR__{{ steps.configure.outcome }}
          BUILD_OUTCOME: __DOLLAR__{{ steps.build.outcome }}
          TEST_OUTCOME: __DOLLAR__{{ steps.test.outcome }}
        run: |
          mkdir -p verification/sanitizers
          python3 - <<'PY_EVIDENCE'
          import json
          import os
          from pathlib import Path

          outcomes = {
              "checkout": os.environ.get("CHECKOUT_OUTCOME", "skipped"),
              "dependencies": os.environ.get("DEPENDENCIES_OUTCOME", "skipped"),
              "configure": os.environ.get("CONFIGURE_OUTCOME", "skipped"),
              "build": os.environ.get("BUILD_OUTCOME", "skipped"),
              "test": os.environ.get("TEST_OUTCOME", "skipped"),
          }
          status = "PASS" if all(value == "success" for value in outcomes.values()) else "FAIL"
          Path("verification/sanitizers/result.json").write_text(
              json.dumps({"schema_version": 1, "status": status, "steps": outcomes}, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY_EVIDENCE
          status=failure
          if [[ "$CHECKOUT_OUTCOME" == success && \
                "$DEPENDENCIES_OUTCOME" == success && \
                "$CONFIGURE_OUTCOME" == success && \
                "$BUILD_OUTCOME" == success && \
                "$TEST_OUTCOME" == success ]]; then
            status=success
          fi
          if [[ -f scripts/lg_verification.py ]]; then
            python3 scripts/lg_verification.py collect-ci \
              --evidence-root verification \
              --platform linux \
              --category unit \
              --status "$status"
          fi

      - name: Upload sanitizer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-sanitizers-__DOLLAR__{{ github.run_attempt }}
          path: |
            verification/**
            build/sanitize/Testing/Temporary/**
          if-no-files-found: error
          retention-days: 3

      - name: Enforce sanitizer result
        if: always()
        shell: bash
        run: |
          for outcome in \
            "__DOLLAR__{{ steps.checkout.outcome }}" \
            "__DOLLAR__{{ steps.dependencies.outcome }}" \
            "__DOLLAR__{{ steps.configure.outcome }}" \
            "__DOLLAR__{{ steps.build.outcome }}" \
            "__DOLLAR__{{ steps.test.outcome }}"; do
            if [[ "$outcome" != success ]]; then
              exit 1
            fi
          done

'''.replace('__DOLLAR__', dollar)
          workflow_path.write_text(text[:start] + block + text[end:], encoding='utf-8')

          docs_path = Path('docs/CI-VERIFICATION.md')
          docs = docs_path.read_text(encoding='utf-8')
          old_checks = '''   - `linux-build-and-tests`
   - `windows-build-and-tests`
   - `deterministic-scenarios`
   - `protocol-and-packet-budgets`
'''
          new_checks = '''   - `linux-build-and-tests`
   - `windows-build-and-tests`
   - `deterministic-scenarios`
   - `protocol-and-packet-budgets`
   - `linux-sanitizers`
'''
          if old_checks not in docs:
              raise SystemExit('required-check list changed unexpectedly')
          docs = docs.replace(old_checks, new_checks, 1)
          marker = '8. **Require conversation resolution before merging**.'
          explanation = '''

`deterministic-scenarios` and `protocol-and-packet-budgets` are lightweight
required-check gates over results produced from the existing Linux build. This
preserves their branch-protection identities without repeating checkout,
configuration, and compilation. `linux-sanitizers` is an independent required
check so moving the focused sanitizer build off the main Linux critical path
does not silently weaken protection.
'''
          if marker not in docs:
              raise SystemExit('required-check marker changed unexpectedly')
          docs = docs.replace(marker, marker + explanation, 1)
          old_sentence = '''The Linux job also runs a small AddressSanitizer and UndefinedBehaviorSanitizer
set without SDL or a GPU. This set supports the main checks; it does not replace
the full CTest run.'''
          new_sentence = '''The independent `linux-sanitizers` job runs a small AddressSanitizer and
UndefinedBehaviorSanitizer set without SDL or a GPU. It executes in parallel,
writes structured step outcomes even when setup or compilation fails, and does
not replace the full Linux CTest run.'''
          if old_sentence not in docs:
              raise SystemExit('sanitizer documentation changed unexpectedly')
          docs = docs.replace(old_sentence, new_sentence, 1)
          docs_path.write_text(docs, encoding='utf-8')
          PY

      - name: Validate workflow syntax
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check "PyYAML==6.0.2"
          python - <<'PY'
          import yaml
          from pathlib import Path
          with Path('.github/workflows/pr-verification.yml').open(encoding='utf-8') as handle:
              loaded = yaml.safe_load(handle)
          if not isinstance(loaded, dict) or 'jobs' not in loaded:
              raise SystemExit('workflow did not parse as a jobs mapping')
          required = {
              'linux-build-and-tests',
              'windows-build-and-tests',
              'deterministic-scenarios',
              'protocol-and-packet-budgets',
              'linux-sanitizers',
          }
          missing = required.difference(loaded['jobs'])
          if missing:
              raise SystemExit('missing workflow jobs: ' + ', '.join(sorted(missing)))
          PY
          git diff --check

      - name: Commit verified fixes
        shell: bash
        run: |
          rm .github/workflows/pr267-review-fixes.yml
          git add .github/workflows/pr-verification.yml docs/CI-VERIFICATION.md .github/workflows/pr267-review-fixes.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix consolidated CI result isolation and evidence"
          git push origin HEAD:agent/test-ci-audit-slice-2
