name: Apply bot ledge safety fix
on:
  push:
    branches: [agent/bot-ledge-avoidance]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bot-ledge-avoidance
      - name: Patch bot movement
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/server/BotAi.cpp')
          s = p.read_text()
          old = '''  // Visible combat permits direct movement. A known health or objective goal\n  // still uses the graph, so a visible enemy cannot turn it into a wall run.\n  const bool directTarget = output.goal == BotGoalKind::Chase && targetVisible &&\n    targetDecisionAllowed;'''
          new = '''  // Combat movement must stay on the same movement-proven graph as every\n  // other goal. Direct visible-target steering used to bypass navigation\n  // completely, so strafing/jumps/dashes could push a bot over an otherwise\n  // avoidable ledge (especially on Overkill's exposed upper routes).\n  const bool directTarget = false;'''
          if old not in s:
              raise SystemExit('direct-target block not found')
          s = s.replace(old, new, 1)
          old = '''    if (output.goal == BotGoalKind::Chase && targetVisible && targetDecisionAllowed) {\n      strafeSeconds_ -= dt;'''
          new = '''    // Do not blend free-form combat dodging into a navigation edge. The nav\n    // link was proved with ordinary movement toward its endpoint; lateral\n    // strafe, random jumps, and dashes invalidate that proof near drop-offs.\n    // Combat remains fully active while movement follows the safe route.\n    if (output.goal == BotGoalKind::Chase && targetVisible && targetDecisionAllowed &&\n        output.waypointNode >= navigation.nodeCount) {\n      strafeSeconds_ -= dt;'''
          if old not in s:
              raise SystemExit('combat-strafe block not found')
          s = s.replace(old, new, 1)
          old = '''  if (output.recoveredFromStuck && !sense.standstill) {\n    command.rightMove = static_cast<float>(strafeDirection_);\n    command.jump = sense.self.onGround;\n  }'''
          new = '''  if (output.recoveredFromStuck && !sense.standstill) {\n    // Recovery used to force a blind sideways jump. That is useful against a\n    // wall but actively dangerous at a ledge. Clear the stale route and let\n    // the next replan choose another proved edge instead of adding unproved\n    // movement here.\n    command.forwardMove = 0.0F;\n    command.rightMove = 0.0F;\n    command.jump = false;\n    command.dash = false;\n  }'''
          if old not in s:
              raise SystemExit('stuck-recovery block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON
      - name: Build bot tests
        run: cmake --build build --target lg_duel_bot_server_tests -j2
      - name: Run bot tests
        run: ctest --test-dir build -R '^lg_duel_bot_server_tests$' --output-on-failure
      - name: Commit fix and remove temporary workflow
        run: |
          git rm .github/workflows/agent-bot-ledge-fix.yml
          git add src/server/BotAi.cpp
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Keep bot movement on navigation near ledges"
          git push origin HEAD:agent/bot-ledge-avoidance
