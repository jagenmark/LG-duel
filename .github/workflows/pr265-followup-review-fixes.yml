name: Apply PR 265 follow-up review fixes

on:
  push:
    branches:
      - integration/replay-killcam-20260816
    paths:
      - .github/workflows/pr265-followup-review-fixes.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: integration/replay-killcam-20260816
          fetch-depth: 2

      - name: Verify expected parent
        shell: bash
        run: test "$(git rev-parse HEAD^)" = "5cdd9f476ae01afeda27a160f0b0e227d7296b76"

      - name: Apply replay and killcam fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text(encoding='utf-8')

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(path: str, old: str, new: str) -> None:
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}')
              write(path, text.replace(old, new, 1))

          def replace_between(path: str, start_marker: str, end_marker: str, replacement: str) -> None:
              text = read(path)
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit(f'{path}: start marker not found: {start_marker!r}')
              end = text.find(end_marker, start)
              if end < 0:
                  raise SystemExit(f'{path}: end marker not found: {end_marker!r}')
              write(path, text[:start] + replacement + text[end:])

