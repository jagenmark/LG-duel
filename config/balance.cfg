version 1

# Non-console authoritative balance values.
# Values in this file are loaded by the server at startup. Do not put cvars here.
# Console-backed gameplay values, including g_* development knobs, live in
# server_cvars.cfg instead.

# Lightning Gun: damage, fire rate, and Q3-scale knockback are g_* cvars.
weapon.lg.range 18
weapon.lg.eye_height 0.65


# Railgun: damage is g_rg_damage.
weapon.rg.range 300
weapon.rg.eye_height 0.65
weapon.rg.knockback 20
weapon.rg.cooldown_ticks 188

# Machine Gun: damage is g_mg_damage.
weapon.mg.range 300
weapon.mg.eye_height 0.65
weapon.mg.knockback 0.11
weapon.mg.spread_radians 0
weapon.mg.cooldown_ticks 13

# Shotgun: pellet damage is g_sg_damage.
weapon.sg.range 18
weapon.sg.pellet_count 20
weapon.sg.spread_radians 0.0872665
weapon.sg.eye_height 0.65
weapon.sg.knockback 22
weapon.sg.cooldown_ticks 125

# Rocket Launcher: damage and Q3-scale knockback are g_rl_damage/g_rl_knockback.
weapon.rl.speed 22.5
weapon.rl.radius 5
# Direct projectile collision only; does not affect splash or regular player collision.
# Base value at g_playersize_xy 1 / g_playersize_z 1, scaled by player-size cvars.
weapon.rl.direct_hitbox_half_extent_xy 0.4821429
weapon.rl.direct_hitbox_half_extent_z 0.9
weapon.rl.eye_height 0.65
weapon.rl.max_lifetime_ticks 1000
weapon.rl.cooldown_ticks 100

# Grenade Launcher: damage and Q3-scale knockback share g_rl_damage/g_rl_knockback
# while movement, fuse, collision, and bounce behavior are non-console balance.
weapon.gl.speed 15
weapon.gl.vertical_boost 5
weapon.gl.gravity 25
weapon.gl.bounce_damping 0.7
weapon.gl.rest_speed 1.5
weapon.gl.bounce_sound_min_speed 1.2
weapon.gl.projectile_radius 0.15
weapon.gl.projectile_hitbox_radius 0.18
weapon.gl.radius 3
weapon.gl.eye_height 0.65
weapon.gl.fuse_seconds 2.5
weapon.gl.cooldown_ticks 100

# Plasma Gun: damage is g_pg_damage.
weapon.pg.speed 50
weapon.pg.radius 0.75
# Direct projectile collision only; does not affect splash or regular player collision.
# Base value at g_playersize_xy 1 / g_playersize_z 1, scaled by player-size cvars.
weapon.pg.direct_hitbox_half_extent_xy 0.4821429
weapon.pg.direct_hitbox_half_extent_z 0.9
weapon.pg.knockback 2.2
weapon.pg.eye_height 0.65
weapon.pg.max_lifetime_ticks 325
weapon.pg.cooldown_ticks 13

# QL weapon switching pullout delay. Switching mode itself is g_weaponswitching.
weapon.switch_pullout_ticks 20
