version 1

# Grenade Launcher authoritative tuning.
# speed and vertical_boost form the launch arc with gravity.
grenade.speed 15
grenade.vertical_boost 5
grenade.gravity 25

# 1.0 is a perfectly elastic bounce, lower values lose speed.
grenade.bounce_damping 0.7
# Grenades stop simulating bounce checks once floor impacts settle below this speed.
grenade.rest_speed 1.5
# Impacts below this normal speed do not emit bounce audio.
grenade.bounce_sound_min_speed 1.2

# Projectile replicated ball size and direct-hit collision radius.
# Set projectile_hitbox_radius to 0 to disable grenade direct hits.
grenade.projectile_radius 0.15
grenade.projectile_hitbox_radius 0.18

# Explosion behavior.
grenade.fuse_seconds 2.5
grenade.radius 3.0
grenade.direct_damage 100
grenade.splash_damage 100
grenade.knockback 22.0

# Server ticks are fixed at 125 Hz; 100 ticks is 0.8 seconds.
grenade.cooldown_ticks 100
