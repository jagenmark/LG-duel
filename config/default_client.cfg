# Default client config.
# Loaded before the user client.cfg in %AppData%/LG Duel/LG Duel.
# User client.cfg is written by writeconfig and overrides these defaults.

# Config/schema marker used by client-side migrations.
set cl_config_version 17

# Input and camera.
set sensitivity 5
set cl_mouseAccel 0
set cl_mouseAccelPower 2
set cl_mouseAccelOffset 0
set cl_mouseSensCap 0
set cl_late_mouse_sample 1
set cl_fov 90
set cl_zoom_fov 45
set cl_zoom_sniper_fov 45
set cl_zoom_sensitivity 0
set cl_death_spectate_threshold 3
set cl_death_camera_hold 0.5
set cl_death_desaturation 1
set cl_viewmodel_motion_scale 1
set cl_viewmodel_bob_scale 0.65
set cl_viewmodel_sway_scale 0.55
set cl_viewmodel_inertia_scale 0.55
set cl_viewmodel_landing_scale 0.65
set cl_camera_position_response 0
set cl_local_render_prediction 1
set cl_legacy_frame_delay 0
set cl_interp_mode 1
set cl_interp 0.024
set cl_interp_adaptive 1
set cl_interp_min 0.016
set cl_interp_max 0.064
set cl_interp_extrapolate 0.016

# HUD and diagnostics.
set cl_health_size 2
set cl_health_style 0
set cl_health_offset_x 0
set cl_health_offset_y 0
set cl_speed_size 1.5
set cl_weapon_bar_size 1.75
set r_ui_font "bahnschrift.ttf"
set cl_showfps 0
set cl_showfps_size 1.6
set cl_showfps_titlebar 0
set cl_show_frame_stats 0
set cl_showspeed 1
set cl_show_net 1
set cl_netgraph 0
set cl_netgraph_scale 1.75
set cl_show_lagcomp 0
set cl_show_alive_counts 0
set r_perf 0
set r_perf_detail 0
set r_perf_reset 0

# Audio master toggle/volume. Per-cue mix defaults live in sound_mixer.cfg.
set s_enable 1
set s_volume 0.35

# Crosshair.
set crosshair 1
set crosshair_style 0
set crosshair_size 8
set crosshair_width 2
set crosshair_gap 3
set crosshair_dot 0
set crosshair_dot_width 2
set crosshair_outline 0
set crosshair_outline_width 1
set crosshair_alpha 1
set crosshair_r 255
set crosshair_g 255
set crosshair_b 255
set crosshair_hit 1
set crosshair_hit_r 255
set crosshair_hit_g 255
set crosshair_hit_b 255
set crosshair_hit_duration 0.12
set crosshair_hit_fade 1

# Video and renderer.
set vid_fullscreen 0
set vid_width 1280
set vid_height 720
set vid_refresh_hz 0
set vid_display 0
set r_present_mode 0
set r_maxfps 0
set r_vsync 1
set r_render_scale 1
set r_frustum_cull 1
set r_world_frustum_cull 0
set r_show_collision 0
set r_texture_filter 2
set r_texture_anisotropy 8
set r_texture_lod_bias 0.5
set r_draw_remote_players 1
set r_draw_remote_weapons 1
set r_show_weapons 1
set r_weapon_pos 0
set r_draw_player_outlines 1
# Remote player body: 0 legacy boxes, 1 Quaternius Worker (default).
set r_player_model 1

# Lightning beam and hit feedback.
set r_beam_width 2
set r_beam_alpha 1
set r_beam_r 74
set r_beam_g 166
set r_beam_b 255
set r_beam_hit 1
set r_beam_hit_r 255
set r_beam_hit_g 255
set r_beam_hit_b 255
set r_beam_hit_duration 0.12
set r_beam_hit_fade 1
set r_enemy_beam_width 2
set r_enemy_beam_alpha 1
set r_enemy_beam_r 255
set r_enemy_beam_g 110
set r_enemy_beam_b 80
set r_teammate_beam_width 2
set r_teammate_beam_alpha 1
set r_teammate_beam_r 80
set r_teammate_beam_g 220
set r_teammate_beam_b 150

# Hitmarker and damage numbers.
set r_hitmarker 1
set r_hitmarker_duration 0.12
set r_hitmarker_size 10
set r_hitmarker_width 2
set r_hitmarker_r 255
set r_hitmarker_g 255
set r_hitmarker_b 255
set r_damage_numbers_mode 0
set r_damage_numbers_window 0.4
set r_damage_numbers_duration 0.65
set r_damage_numbers_size 1.6
set r_damage_numbers_alpha 1
set r_damage_numbers_r 255
set r_damage_numbers_g 236
set r_damage_numbers_b 128
set r_damage_numbers_damage_color 0
set r_damage_numbers_offset_x 0
set r_damage_numbers_offset_y -46
set r_damage_indicator 1
set r_damage_indicator_duration 0.8
set r_damage_indicator_opacity 0.85
set r_damage_indicator_distance 24
set r_damage_indicator_scale 1

# Enemy model, outline, and overlays.
set r_enemy_r 224
set r_enemy_g 82
set r_enemy_b 92
set r_enemy_alpha 1
set r_enemy_outline 1
set r_player_outline_mode 2
set r_player_outline_style 0
set r_player_outline_width 1.5
set r_player_outline_debug_mask 0
set r_enemy_outline_width 3
set r_enemy_outline_alpha 1
set r_enemy_outline_r 255
set r_enemy_outline_g 220
set r_enemy_outline_b 84
set r_enemy_lean 1
set r_enemy_lean_scale 1
set r_enemy_hit 1
set r_enemy_hit_r 255
set r_enemy_hit_g 190
set r_enemy_hit_b 198
set r_enemy_hit_duration 0.12
set r_enemy_hit_fade 1
set r_enemy_health 1
set r_enemy_health_damage_only 0
set r_enemy_health_fade 1
set r_enemy_health_duration 5
set r_enemy_health_max_distance 0
set r_enemy_health_width 72
set r_enemy_health_height 7
set r_enemy_health_offset_z 0.35
set r_enemy_health_offset_x 0
set r_enemy_health_offset_y -18
set r_enemy_health_alpha 1
set r_enemy_health_r 224
set r_enemy_health_g 82
set r_enemy_health_b 92
set r_enemy_name 1
set r_enemy_name_alpha 1
set r_enemy_name_font_size 1.5
set r_enemy_name_offset_z 0.75
set r_enemy_name_offset_x 0
set r_enemy_name_offset_y -34
set r_enemy_name_max_distance 0
set r_enemy_name_r 255
set r_enemy_name_g 235
set r_enemy_name_b 235

# Teammate model, outline, and overlays.
set r_teammate_r 82
set r_teammate_g 190
set r_teammate_b 224
set r_teammate_alpha 1
set r_teammate_outline 1
set r_teammate_outline_width 3
set r_teammate_outline_alpha 1
set r_teammate_outline_r 128
set r_teammate_outline_g 240
set r_teammate_outline_b 255
set r_teammate_lean 1
set r_teammate_lean_scale 1
set r_teammate_health 1
set r_teammate_health_damage_only 0
set r_teammate_health_fade 1
set r_teammate_health_duration 5
set r_teammate_health_max_distance 0
set r_teammate_health_width 72
set r_teammate_health_height 7
set r_teammate_health_offset_z 0.35
set r_teammate_health_offset_x 0
set r_teammate_health_offset_y -18
set r_teammate_health_alpha 1
set r_teammate_health_r 82
set r_teammate_health_g 190
set r_teammate_health_b 224
set r_teammate_name 1
set r_teammate_name_alpha 1
set r_teammate_name_font_size 1.5
set r_teammate_name_offset_z 0.75
set r_teammate_name_offset_x 0
set r_teammate_name_offset_y -34
set r_teammate_name_max_distance 0
set r_teammate_name_r 210
set r_teammate_name_g 245
set r_teammate_name_b 255

# Shotgun rendering compatibility.
set r_sg_weapon_model_start 0

# Combat effects and fixed highlight response.
set r_combat_effects 2
set r_muzzle_light_intensity 2.4
set r_muzzle_light_radius 3.2
set r_muzzle_light_duration 0.13
set r_tonemap_exposure 1
set r_display_gamma 1
set r_atmosphere_grade 2
set r_bloom 1
set r_bloom_intensity 0.18
set r_bloom_threshold 1.15
set r_antialiasing 1
set r_sun_shadows 2
set r_point_lights 1
set r_point_shadows 1
set r_contact_shadows 1
set r_material_quality 1
set r_ambient_grounding 2
set r_player_rim 1
set r_casings 1
set r_casing_count 1
set r_casing_lifetime 2.4
set r_casing_max 48
set r_impact_particles 1
set r_impact_particle_max 192
set r_decals_max 128
set r_decal_lifetime 24
set r_mg_barrel_max_rps 14
set r_mg_barrel_spin_up 0.25
set r_mg_barrel_spin_down 0.55

# Client-only network simulator. These defaults intentionally do nothing.
set net_sim_latency_ms 0
set net_sim_jitter_ms 0
set net_sim_loss_percent 0
set net_sim_reorder_percent 0
set net_sim_seed 0

# Default bindings. The user client.cfg can override or unbind these.
bind section "toggleconsole"
bind w "+forward"
bind s "+back"
bind a "+moveleft"
bind d "+moveright"
bind space "+moveup"
bind leftctrl "+movedown"
bind rightctrl "+movedown"
bind leftshift "+speed"
bind rightshift "+speed"
bind mouse1 "+attack"
bind mouse2 "+zoom"
bind mouse3 "+dash"
bind g "mcguffin_throw"
bind tab "+scores"
bind f3 "ready"
bind f5 "resetmatch"
bind f10 "settings"
bind f11 "misc"
bind t "messagemode"
bind z "+showchat"
bind 1 "weapon mg"
bind 2 "weapon sg"
bind 3 "weapon gl"
bind 4 "weapon rl"
bind 5 "weapon lg"
bind 6 "weapon rg"
bind 7 "weapon pg"
bind 8 "weapon fg"
bind 9 "weapon re"
bind q "weapon rl"
bind e "weapon lg"
bind r "weapon rg"
