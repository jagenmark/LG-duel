# Server startup cvars.
# This file is executed by lg_duel_server after server cvars are registered.
# Values can still be changed in the server console at runtime.

# Match flow.
set sv_roundlimit 10
set sv_timelimit 0
set sv_playerlimit 2
set sv_countdown 5
set sv_roundend 5
set sv_matchend 5
set sv_respawn_delay 2
set sv_showopponenthealth 1

# Saved demos and remote killcams.
set sv_demo_autorecord 0
set sv_demo_checkpoint_ticks 250
set sv_demo_hash_ticks 125
set sv_demo_max_file_mb 512
set sv_demo_max_resident_mb 512
set sv_killcam 1
set sv_killcam_before_seconds 3
set sv_killcam_after_seconds 0
set sv_killcam_transfer_timeout_ms 5000
set sv_killcam_max_segment_kb 512
set sv_killcam_packets_per_tick 2
set sv_replay_rolling_seconds 12
set sv_replay_rolling_max_mb 16

# McGuffin. Ground drops return to neutral spawn after 30 seconds as a safety net.
set sv_mcg_scorelimit 100
set sv_mcg_points_per_second 1
set sv_mcg_carry_points_per_second 1
set sv_mcg_carry_limit 10
set sv_mcg_spawn_delay 30
set sv_mcg_install_delay 0
set sv_mcg_steal_time 1
set sv_mcg_return_time 30
set sv_mcg_throw_speed 12
set sv_mcg_throw_up_speed 4
set sv_mcg_throw_velocity_inherit 1
set sv_mcg_throw_gravity 20
set sv_mcg_throw_bounce 0.4
set sv_mcg_throw_pickup_delay 0.2
set sv_mcg_final_hold 3
set sv_mcg_pickup_radius 0.9

# Movement. These g_* cvars are still accepted from clients for development;
# that temporary client-push path can override this file until it is removed.
set g_accel 7.5
set g_airaccel 3
set g_aircontrol 1
set g_friction 1.35
set g_stopspeed 1
set g_maxspeed 10.5
set g_dash_targetspeed 11.5
set g_dash_maxspeed 12.5
set g_dash_accel 200
set g_dash_duration 0.10
set g_dash_cooldown 0.85
set g_dash_groundhop 3.25
set g_dash_airhop 1.875
set g_flight 0
set g_flightaccel 32
set g_flightmaxspeed 12
set g_flightdamping 2

# Player dimensions and health.
set g_playersize_xy 1
set g_playersize_z 1
set g_healthamount 100

# Weapon damage, fire-rate, knockback, and self-damage cvars.
set g_sg_damage 5
set g_mg_damage 5
set g_lg_damage 120
set g_fg_damage 120
set g_lg_fire_hz 20
set g_lg_knockback 1000
set g_rg_damage 50
set g_rl_damage 100
set g_rl_knockback 1000
set g_knockback_time_ms 100
set g_pg_damage 20
set g_selfdamage 100
set g_infiniteammo 1
set g_vampirism 0

# Weapon switching mode: ql, cpma, or crazy.
set g_weaponswitching crazy
